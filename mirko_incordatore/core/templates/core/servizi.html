{% extends 'core/base.html' %}

{% block title %}Servizi{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Servizi disponibili</h2>
    <div class="row">
        {% for servizio in servizi %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ servizio.nome }}</h5>
                    <p class="card-text">{{ servizio.descrizione }}</p>
                    <p class="card-text"><strong>Prezzo: €{{ servizio.prezzo }}</strong></p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<a href="{% url 'home' %}" class="btn btn-secondary mb-3">Torna alla Home</a>
{% endblock %}
